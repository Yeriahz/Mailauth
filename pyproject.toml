[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailauth"
version = "1.0.0"
description = "Passive email authentication review over public DNS: SPF, DKIM, DMARC, MTA-STS, TLS-RPT and BIMI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jeriah Keith", email = "yeriahz@sscsnv.com" }]
maintainers = [{ name = "Jeriah Keith", email = "yeriahz@sscsnv.com" }]
keywords = ["spf", "dkim", "dmarc", "email", "dns", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Security",
]

# dnspython is the only runtime dependency. Everything else this tool needs is
# in the standard library: tomllib for the weights file (which is why 3.11 is the
# floor), sqlite3 for the run history, and urllib for the one gated HTTPS fetch.
dependencies = ["dnspython>=2.4"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
mailauth = "mailauth.cli:main"

[project.urls]
Homepage = "https://sscsnv.com"
Repository = "https://github.com/Yeriahz/Mailauth"
Issues = "https://github.com/Yeriahz/Mailauth/issues"

[tool.setuptools]
packages = ["mailauth", "mailauth.checks"]

[tool.setuptools.package-data]
mailauth = ["weights.toml"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Live DNS tests are deselected here rather than merely labelled. CI has no
# reliable outbound DNS, and a suite that fails on a flaky network teaches
# everyone to ignore it. Run them deliberately with: pytest -m live
addopts = "-q --strict-markers --strict-config -m 'not live'"
markers = ["live: hits real DNS servers; deselected by default"]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["mailauth"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return consistency
    "S",    # bandit
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    # Long lines inside the prose of a finding detail are more readable than the
    # same text broken across three implicit concatenations.
    "E501",
    # subprocess is used exactly once, in `mailauth selftest`, with a fixed
    # argument list built from sys.executable.
    "S404",
    "S603",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use hardcoded fixture values, and touch private helpers.
"tests/*" = ["S101", "S105", "S106", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["mailauth"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["build/"]

[[tool.mypy.overrides]]
# dnspython ships type hints, but the rdata attribute access in dns_client is
# dynamic by nature: the attributes available depend on the record type.
module = "dns.*"
ignore_missing_imports = true
